<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כוחות העל של ה־AI – לומדה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0a0618; --bg1:#141033; --card:#191241; --card2:#130d33; --line:#34245f;
  --ink:#f1edff; --muted:#a99fd6; --p1:#7b2ff7; --p2:#00d4ff; --gold:#ffcf3f; --good:#2bff9b; --bad:#ff5d73;
  --shadow:0 18px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Rubik",system-ui,Arial,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 12% 0,#3a1a7a 0,transparent 45%),radial-gradient(circle at 92% 100%,#0a4a6e 0,transparent 45%),linear-gradient(160deg,var(--bg0),var(--bg1));
  background-attachment:fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1px);background-size:34px 34px}
button{font-family:inherit;cursor:pointer}
.wrap{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:16px 16px 60px}
.topbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 16px;margin-bottom:16px;background:rgba(10,6,24,.85);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px}
.brand{font-weight:900;background:linear-gradient(90deg,var(--p2),var(--p1));-webkit-background-clip:text;background-clip:text;color:transparent}
.prog-pill{color:var(--muted);font-weight:700;font-size:.95rem}
.icon-btn{background:rgba(123,47,247,.18);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:36px;font-size:1rem}
.bar{height:6px;background:#0e0824;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--p2),var(--p1));transition:width .4s}
.screen{display:none;animation:fade .4s ease}.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px;text-align:center}
h1{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:900;margin:.1em 0}
h2{font-size:clamp(1.5rem,4.6vw,2.3rem);font-weight:900;margin:.1em 0;line-height:1.25}
.grad{background:linear-gradient(90deg,var(--p2),var(--p1),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:1.14rem;line-height:1.7;color:#ddd4ff;max-width:44ch;margin:10px auto}
.big-emo{font-size:clamp(3.4rem,13vw,6rem);line-height:1}
.needs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.need{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;font-size:1rem}
.prereq{background:rgba(255,207,63,.1);border:1px solid var(--gold);border-radius:16px;padding:16px 18px;max-width:520px;margin:16px auto;text-align:right;line-height:1.8}
.steps{text-align:right;max-width:520px;margin:14px auto;counter-reset:s;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:12px 50px 12px 14px;margin-bottom:10px;background:#0e0824;border:1px solid var(--line);border-radius:12px;line-height:1.6;font-size:1.08rem}
.steps li::before{content:counter(s);position:absolute;right:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;display:grid;place-items:center;font-weight:900}
.box{border-radius:14px;padding:12px 16px;max-width:520px;margin:12px auto;text-align:right;line-height:1.7;font-size:1.04rem}
.box.wow{background:rgba(255,95,176,.12);border-right:5px solid #ff5fb0}
.box.tip{background:rgba(0,212,255,.1);border-right:5px solid var(--p2)}
.box.teach{background:rgba(255,207,63,.1);border-right:5px solid var(--gold)}
.open-btn{display:inline-block;text-decoration:none;background:linear-gradient(135deg,var(--good),#17c47e);color:#042;border-radius:14px;padding:15px 32px;font-size:1.2rem;font-weight:900;box-shadow:0 6px 18px rgba(43,255,155,.35);margin:10px 0}
.open-btn:active{transform:translateY(2px)}
.big-btn{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:0;border-radius:14px;padding:15px 34px;font-size:1.2rem;font-weight:900;box-shadow:0 6px 18px rgba(123,47,247,.45)}
.ghost-btn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 22px;font-weight:700}
/* lock */
.lock{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px}
.lock .lk-title{font-weight:800;color:var(--gold);margin-bottom:10px}
.lock-row{display:flex;gap:8px;max-width:360px;margin:0 auto;justify-content:center}
.lock-row input{flex:1;font-size:1.3rem;font-weight:800;text-align:center;letter-spacing:4px;padding:12px;border-radius:12px;background:#0e0824;border:2px solid var(--line);color:var(--ink)}
.lock-row input:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 3px rgba(0,212,255,.15)}
.hinttxt{color:var(--muted);font-size:.92rem;margin-top:8px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;border-top:1px dashed var(--line);padding-top:18px;flex-wrap:wrap}
.lock-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.lock-inline input{font-size:1.2rem;font-weight:800;text-align:center;letter-spacing:4px;padding:11px;border-radius:12px;background:#0e0824;border:2px solid var(--line);color:var(--ink);width:150px}
.lock-inline input:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 3px rgba(0,212,255,.15)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) scale(.85);background:#191241;border:1px solid var(--p2);color:var(--ink);font-weight:700;padding:12px 24px;border-radius:12px;opacity:0;transition:.25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.shake{animation:shake .4s}@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:150}
.badge-win{border:6px double var(--gold);border-radius:22px;padding:30px;background:linear-gradient(180deg,#191241,#130d33)}
.float{animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
@media (max-width:600px){.card{padding:18px}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <div class="topbar">
    <div class="brand">🤖 כוחות העל של ה־AI</div>
    <div class="prog-pill" id="prog"></div>
    <button class="icon-btn" id="soundBtn" title="צליל">🔊</button>
  </div>
  <div class="bar"><div id="barFill"></div></div>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== instructor codes — a different code to unlock each page (change here if you like) ===== */
const CODES = {1:"4728", 2:"3165", 3:"9042", 4:"5873", 5:"2614", 6:"7390", 7:"1958"};

const TOOLS={
  blob:"https://artsandculture.google.com/experiment/blob-opera/AAHWrq360NcGbw",
  saywhat:"https://artsandculture.google.com/experiment/say-what-you-see/jwG3m7wQShZngw",
  scroobly:"https://scroobly.com/",
  emoji:"https://emojiscavengerhunt.withgoogle.com/",
  voice:"https://www.openai.fm/",
  suno:"https://suno.com/create",
  translate:"https://translate.google.com/?sl=iw&tl=en&op=translate",
};

/* ===== pages ===== */
const PAGES=[
  {kind:"intro"},
  {kind:"station", n:1, emo:"🎼", needs:["🔊 אוזניות"], title:"אופרת הבלובים",
   sub:"AI ששרה 🎶", url:TOOLS.blob, btn:"פתח את Blob Opera ↗",
   steps:["גררו את 4 הבלובים הצבעוניים — כל אחד שר בקול אחר.","גוררים למעלה/למטה = צליל גבוה/נמוך. קדימה/אחורה = סוג הקול (אה / או / מם).","ה־AI דואג שכל הקולות יישמעו ביחד בהרמוניה — נסו לשיר שיר מוכר!"],
   wow:"🎅 בפינה יש כובע חג — לחצו עליו לשירי חג מצחיקים."},
  {kind:"station", n:2, emo:"🎯", needs:[], title:"תגיד מה אתה רואה",
   sub:"AI שמציירת לפי מילים", url:TOOLS.saywhat, btn:"פתח את Say What You See ↗",
   steps:["האתר מציג <b>תמונת מטרה</b>.","כותבים תיאור <b>באנגלית</b>, וה־AI מציירת לפי מה שכתבתם.","ככל שהתיאור מדויק יותר (דמות + פעולה + מקום + צבעים) — הציון גבוה יותר!"],
   tip:"לא יודעים אנגלית? כתבו בעברית ב-<a href='"+TOOLS.translate+"' target='_blank' style='color:var(--p2)'>Google Translate</a>, והדביקו את התרגום."},
  {kind:"station", n:3, emo:"🎭", needs:["📷 מצלמת רשת"], title:"הבובה החיה",
   sub:"AI שמפעילה את הציור שלכם", url:TOOLS.scroobly, btn:"פתח את Scroobly ↗",
   steps:["מציירים דמות או דודל פשוט (או בוחרים דמות מוכנה באתר).","עומדים מול <b>המצלמה</b> — והדמות מחקה את התנועות שלכם <b>בזמן אמת</b>!","אתם ה‑<b>בובנאי</b> 🎭: הזיזו ידיים, קפצו, רקדו — והדמות זזה איתכם."],
   wow:"ה‑AI מזהה את תנועות הגוף שלכם (זיהוי שלד) ומעבירה אותן לדמות. גרמו לה לרקוד! 🕺"},
  {kind:"station", n:4, emo:"📷", needs:["📷 מצלמת רשת"], title:"ציד האימוג׳י",
   sub:"AI שרואה את העולם", url:TOOLS.emoji, btn:"פתח את Emoji Scavenger Hunt ↗",
   steps:["האתר מראה <b>אימוג׳י</b> (למשל 👟 נעל, ✏️ עיפרון).","רוצו למצוא את <b>החפץ האמיתי</b> בכיתה והראו אותו למצלמה — לפני שהזמן נגמר!","ה־AI מזהה את החפץ דרך המצלמה. מצאתם? ממשיכים לאימוג׳י הבא 🏃"],
   wow:"כמה אימוג׳ים תצליחו למצוא ברצף? קבעו שיא כיתה! 🏆"},
  {kind:"station", n:5, emo:"🎧", needs:["🔊 אוזניות"], title:"הקול הדרמטי",
   sub:"AI שמדברת", url:TOOLS.voice, btn:"פתח את OpenAI.fm ↗",
   steps:["כותבים משפט בתיבת <b>SCRIPT</b>.","בוחרים קול (<b>VOICE</b>) ו‑‘וייב’ (<b>VIBE</b>): דרמטי, רגוע, שמח, שודד ים…","לוחצים <b>PLAY</b> ושומעים את ה־AI מקריאה את המשפט!"],
   wow:"כתבו משפט משעמם (“אני הולך לצחצח שיניים”) והשמיעו אותו בקול דרמטי — מצחיק! 😂"},
  {kind:"station", n:6, emo:"🎵", needs:["📽️ מסך המדריך/ה"], title:"תחרות השירים", teacher:true,
   sub:"AI שמלחינה", url:TOOLS.suno, btn:"פתח את Suno ↗ (למדריך/ה)",
   steps:["כל צוות כותב <b>4–8 שורות</b> לשיר בנושא שבוחרים.","המדריך/ה מפיק/ה את השיר ב-Suno על המקרן.","מצביעים לשיר הכי טוב — והוא מושמע שוב בסוף! 🏆"]},
  {kind:"finish"},
];
let page=0, maxUnlocked=0, sound=true;

/* sound + toast + confetti */
let actx;
function beep(f,dur=.09,type="sine",vol=.12){if(!sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
  f.forEach((x,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=x;o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime+i*dur;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02)})}catch(e){}}
const sGood=()=>beep([660,880,1046],.11),sBad=()=>beep([200,160],.14,"sawtooth"),sWin=()=>beep([523,659,784,1046],.13);
const $=s=>document.querySelector(s);
$("#soundBtn").onclick=()=>{sound=!sound;$("#soundBtn").textContent=sound?"🔊":"🔇"};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1600)}
const cv=$("#confetti"),cx=cv.getContext("2d");let bits=[];
function confetti(n=140){cv.width=innerWidth;cv.height=innerHeight;const c=["#7b2ff7","#00d4ff","#ffcf3f","#2bff9b","#ff5fb0"];
  for(let i=0;i<n;i++)bits.push({x:Math.random()*cv.width,y:-20,r:5+Math.random()*6,c:c[i%c.length],vy:2.5+Math.random()*3,vx:-2+Math.random()*4,a:Math.random()*6});
  if(bits.length===n)requestAnimationFrame(cl)}
function cl(){cx.clearRect(0,0,cv.width,cv.height);bits.forEach(b=>{b.y+=b.vy;b.x+=b.vx;b.a+=.12;cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);cx.fillStyle=b.c;cx.fillRect(-b.r/2,-b.r/2,b.r,b.r*1.6);cx.restore()});bits=bits.filter(b=>b.y<cv.height+20);if(bits.length)requestAnimationFrame(cl);else cx.clearRect(0,0,cv.width,cv.height)}

const stationNums=PAGES.filter(p=>p.kind==="station").length;
function navHTML(){
  const prev = page>0 ? `<button class="ghost-btn" id="prevBtn">→ הקודם</button>` : `<span></span>`;
  const target=page+1;
  if(target>=PAGES.length) return `<div class="nav">${prev}<span></span></div>`;
  let fwd;
  if(target<=maxUnlocked){
    fwd=`<button class="big-btn" id="fwdBtn">המשך ←</button>`;
  }else{
    const lbl=(PAGES[target].kind==="finish")?"לסיום":(page===0?"להתחלה":"לתחנה הבאה");
    fwd=`<div class="lock-inline"><input id="code" inputmode="numeric" maxlength="8" placeholder="קוד מדריך/ה" autocomplete="off"><button class="big-btn" id="goBtn">🔒 ${lbl}</button></div>`;
  }
  const note = target<=maxUnlocked ? "" : `<div class="hinttxt">🔒 בקשו מהמדריך/ה את הקוד של התחנה הבאה — לכל תחנה קוד משלה ✋</div>`;
  return `<div class="nav">${prev}${fwd}</div>${note}`;
}
function wireNav(){
  const pv=document.getElementById("prevBtn"); if(pv)pv.onclick=()=>{beep([330,440]);page--;render();scrollTo({top:0,behavior:"smooth"});};
  const fw=document.getElementById("fwdBtn"); if(fw)fw.onclick=()=>{beep([440,660]);page++;render();scrollTo({top:0,behavior:"smooth"});};
  const go=document.getElementById("goBtn"); if(go){ go.onclick=tryCode; const inp=document.getElementById("code"); inp.addEventListener("keydown",e=>{if(e.key==="Enter")tryCode()}); setTimeout(()=>inp.focus(),120); }
}
function render(){
  const p=PAGES[page];
  $("#barFill").style.width=(page/(PAGES.length-1)*100)+"%";
  const st=PAGES.slice(0,page+1).filter(x=>x.kind==="station").length;
  $("#prog").textContent = p.kind==="station" ? `תחנה ${p.n} / ${stationNums}` : "";
  const app=$("#app");
  if(p.kind==="intro"){
    app.innerHTML=`<div class="card">
      <div class="big-emo float">🤖✨</div>
      <h1 class="grad">כוחות העל של ה־AI</h1>
      <p class="lead">היום נגלה 6 "כוחות על" של הבינה המלאכותית: לשיר, לצייר, לראות, לדבר וליצור מוזיקה! עוברים תחנה-תחנה 🚀</p>
      <div class="prereq">
        <b>לפני שמתחילים — צריך:</b><br>
        🎧 <b>אוזניות</b> (לתחנות הקול והשירה)<br>
        📷 <b>מצלמות רשת</b> (לתחנות הבובה החיה וציד האימוג׳י)<br>
        <span style="color:var(--gold)">אם אין מצלמות רשת במעבדה — לבקש מהאחזקה מראש.</span>
      </div>
      <p class="lead">בסוף כל תחנה — מבקשים מהמדריך/ה את הקוד של התחנה הבאה (<b>לכל תחנה קוד אחר</b>).</p>
      ${navHTML()}
    </div>`;
    wireNav();
    return;
  }
  if(p.kind==="finish"){
    app.innerHTML=`<div class="card badge-win">
      <div class="big-emo">🏅</div>
      <h1 class="grad">כל הכבוד, חוקרי AI!</h1>
      <p class="lead">גיליתם שה־AI יכולה <b>לשיר, לצייר, לראות, לדבר וליצור מוזיקה</b> — הכול בשניות.</p>
      <div class="box teach" style="border-right-color:var(--p2);background:rgba(0,212,255,.1)">
        🧭 <b>לחשוב יחד:</b> ה־AI לומדת <b>מאיתנו</b> — והיא לא תמיד צודקת!<br>
        • אם AI יכולה לחקות קול — מה יקרה אם מישהו יחקה את הקול של אמא בטלפון? (לכן כדאי <b>מילת קוד</b> במשפחה 🔑)<br>
        • השיר שיצרנו — של מי הוא? שלנו? של ה־AI? של האמנים שהיא למדה מהם?
      </div>
      <div class="nav" style="justify-content:center;gap:12px"><button class="ghost-btn" id="prevBtn">→ הקודם</button><button class="ghost-btn" id="restartBtn">🔄 מהתחלה</button></div>
    </div>`;
    sWin(); confetti(220);
    const pv=document.getElementById("prevBtn"); if(pv)pv.onclick=()=>{beep([330,440]);page--;render();scrollTo({top:0,behavior:"smooth"});};
    $("#restartBtn").onclick=()=>{beep([440,660]);page=0;maxUnlocked=0;render()};
    return;
  }
  // station
  const needs=(p.needs&&p.needs.length)?`<div class="needs">${p.needs.map(n=>`<span class="need">${n}</span>`).join("")}</div>`:"";
  app.innerHTML=`<div class="card">
    <div class="big-emo">${p.emo}</div>
    <h2>${p.title}</h2>
    <div style="color:var(--muted);font-weight:700;font-size:1.1rem">${p.sub}</div>
    ${needs}
    <ol class="steps">${p.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
    ${p.wow?`<div class="box wow">🎉 <b>בוסטר:</b> ${p.wow}</div>`:""}
    ${p.tip?`<div class="box tip">💡 <b>טיפ:</b> ${p.tip}</div>`:""}
    ${p.teach?`<div class="box teach">👩‍🏫 ${p.teach}</div>`:""}
    <a class="open-btn" href="${p.url}" target="_blank" rel="noopener">${p.btn}</a>
    ${navHTML()}
  </div>`;
  wireNav();
}
function tryCode(){
  const target=page+1;
  const v=(document.getElementById("code").value||"").trim();
  if(v===CODES[target]){ sGood(); confetti(60); if(target>maxUnlocked)maxUnlocked=target; page=target; render(); scrollTo({top:0,behavior:"smooth"}); }
  else{ sBad(); const row=document.querySelector(".lock-inline"); if(row){row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake");} toast("קוד שגוי — בקשו מהמדריך/ה את הקוד של התחנה הזו ✋"); const inp=document.getElementById("code"); inp.value=""; inp.focus(); }
}
render();
</script>
</body>
</html>
