<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>סוכני הסייבר הצעירים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&family=Fira+Code:wght@500&display=swap">
<style>
/* Layout: a "mission HQ" — sticky agent bar, a numbered mission trail, and one focused step card at a time with big tap targets. */
:root{
  --bg:#EAF3FF; --bg-dot:#C9DCF7; --surface:#FFFFFF; --surface-2:#F4F8FF;
  --ink:#16264A; --muted:#556A90; --line:#D2E0F4;
  --brand:#2462F0; --brand-ink:#FFFFFF; --brand-soft:#DCE7FF;
  --sun:#F7A41D; --sun-soft:#FFF0D2;
  --go:#0E9B67; --go-soft:#D8F5E8; --stop:#DC3D43; --stop-soft:#FDE2E3;
  --code-bg:#14203D; --code-ink:#E6EEFF; --code-dim:#7F93BD; --code-hl:#FFD166;
  --paper:#FFFFFF; --paper-ink:#1D1D1D;
  --blk-var:#F07C1B; --blk-ctrl:#D99A0B; --blk-say:#8456E8; --blk-ink:#FFFFFF;
  --f-display:"Secular One","Rubik","Arial Hebrew",sans-serif;
  --f-body:"Varela Round","Assistant","Arial Hebrew",Arial,sans-serif;
  --f-code:"Fira Code",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1630; --bg-dot:#1C2A50; --surface:#16213F; --surface-2:#1B2849;
  --ink:#EAF1FF; --muted:#9FB2D6; --line:#2B3B66;
  --brand:#6E9BFF; --brand-ink:#0D1630; --brand-soft:#22345F;
  --sun:#FFC24D; --sun-soft:#3A2F14;
  --go:#3DD39A; --go-soft:#123B2C; --stop:#FF7A7F; --stop-soft:#43191C;
  --code-bg:#091127; --code-ink:#E6EEFF; --code-dim:#7387B3; --code-hl:#FFD166;
  --paper:#FFFFFF; --paper-ink:#1D1D1D;
  --blk-var:#F0862E; --blk-ctrl:#D6A21F; --blk-say:#9573F0; --blk-ink:#FFFFFF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1630; --bg-dot:#1C2A50; --surface:#16213F; --surface-2:#1B2849;
  --ink:#EAF1FF; --muted:#9FB2D6; --line:#2B3B66;
  --brand:#6E9BFF; --brand-ink:#0D1630; --brand-soft:#22345F;
  --sun:#FFC24D; --sun-soft:#3A2F14;
  --go:#3DD39A; --go-soft:#123B2C; --stop:#FF7A7F; --stop-soft:#43191C;
  --code-bg:#091127; --code-ink:#E6EEFF; --code-dim:#7387B3; --code-hl:#FFD166;
  --paper:#FFFFFF; --paper-ink:#1D1D1D;
  --blk-var:#F0862E; --blk-ctrl:#D6A21F; --blk-say:#9573F0; --blk-ink:#FFFFFF;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;
  background-image:radial-gradient(var(--bg-dot) 1.4px,transparent 1.4px);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
#app{direction:rtl}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--line)}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.logo{font-family:var(--f-display);font-size:20px;display:flex;align-items:center;gap:8px}
.logo svg{width:30px;height:30px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:16px;white-space:nowrap}
.chip .av{font-size:22px;line-height:1}
.stars{color:var(--sun);letter-spacing:2px;font-size:20px}
.stars .off{color:var(--line)}
@media (max-width:460px){.logo span{display:none}.chip{padding:4px 9px;font-size:15px}.stars{font-size:17px;letter-spacing:0}}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 22px;font-family:var(--f-display);font-size:20px;background:var(--brand);color:var(--brand-ink);
  box-shadow:0 4px 0 color-mix(in srgb,var(--brand) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--brand) 60%,#000)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:#2A1A00;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.btn.small{font-size:16px;padding:8px 14px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px;padding:4px}

.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:22px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.big{font-size:21px}
.center{text-align:center}

/* start */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.hero h1{font-size:clamp(32px,7vw,50px);color:var(--brand)}
.hero svg{width:clamp(110px,22vw,170px);height:auto}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero svg{justify-self:center;order:-1}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-display);font-size:19px}
.input{border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:20px;width:100%;max-width:420px}
.input:focus{border-color:var(--brand);outline:none}
.avatars{display:flex;gap:10px;flex-wrap:wrap}
.avatars button{width:62px;height:62px;border-radius:16px;border:3px solid var(--line);background:var(--surface-2);font-size:34px;line-height:1}
.avatars button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);transform:scale(1.06)}
.err{color:var(--stop);font-size:16px;min-height:1.4em}

/* map */
.trail{display:flex;flex-direction:column;gap:14px;position:relative}
.mission{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;text-align:start;width:100%;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px}
.mission:not([disabled]):hover{border-color:var(--brand)}
.mission[disabled]{opacity:.55;cursor:not-allowed}
.mission .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;background:var(--brand-soft);color:var(--brand)}
.mission.done .num{background:var(--sun-soft);color:var(--sun)}
.mission h3{font-size:21px}
.mission p{font-size:16px;color:var(--muted)}
.mission .st{font-size:15px;white-space:nowrap;font-family:var(--f-display)}
.mission.done .st{color:var(--sun)}
.mission > div{min-width:0}

/* step */
.mhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.mhead .eyebrow{font-size:15px;color:var(--muted);letter-spacing:.02em}
.mhead h2{font-size:clamp(26px,5vw,34px)}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--brand)}
.dots i.past{background:color-mix(in srgb,var(--brand) 45%,var(--line))}
.stepcard h3{font-size:24px;color:var(--brand)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}

.story p{font-size:20px}
.clue{background:var(--sun-soft);border:2px dashed var(--sun);border-radius:14px;padding:14px 16px}
.clue ol{margin:6px 0 0;padding-inline-start:22px}
.fb{border-radius:12px;padding:10px 14px;font-size:18px}
.fb.ok{background:var(--go-soft);color:var(--go)}
.fb.no{background:var(--stop-soft);color:var(--stop)}
.fb:empty{display:none}

/* tiles */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{min-height:70px;border:3px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface-2);padding:6px}
.slot small{font-size:13px;color:var(--muted)}
.slot b{font-family:var(--f-display);font-size:20px;font-weight:400}
.slot.filled{border-style:solid;border-color:var(--brand)}
.slot.good{border-color:var(--go);background:var(--go-soft)}
.slot.bad{border-color:var(--stop);background:var(--stop-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;font-family:var(--f-display);font-size:20px;box-shadow:0 3px 0 var(--line)}
.tile[disabled]{opacity:.25}
@media (max-width:460px){.slots{grid-template-columns:1fr}}

.login{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:16px;border:2px solid var(--line);max-width:360px;display:flex;flex-direction:column;gap:8px}
.login .lf{border:1px solid #BBB;border-radius:8px;padding:6px 10px;direction:ltr;text-align:left;font-family:var(--f-code);font-size:15px;min-height:36px;color:#1D1D1D;background:#FFF}
.login h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}

/* choice buttons */
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:460px){.opts.two{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 16px;text-align:start;font-size:18px;min-height:56px}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt.ok{border-color:var(--go);background:var(--go-soft)}
.opt.no{border-color:var(--stop);background:var(--stop-soft);animation:shake .35s}
.opt[disabled]{cursor:default}
.pw{direction:ltr;font-family:var(--f-code);font-size:19px;text-align:center}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q{display:flex;flex-direction:column;gap:10px;padding-block:6px}
.q + .q{border-top:2px solid var(--line);padding-top:16px}
.q .qt{font-family:var(--f-display);font-size:20px}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fact{background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.fact .yr{font-family:var(--f-display);color:var(--brand);font-size:15px}
.fact h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.fact p{font-size:16px}

.sortcard{background:var(--surface-2);border:3px solid var(--line);border-radius:18px;padding:22px;text-align:center;font-family:var(--f-display);font-size:23px;min-height:110px;display:grid;place-items:center}
.counter{font-size:15px;color:var(--muted);text-align:center}

/* cipher */
.secret{font-family:var(--f-display);font-size:clamp(28px,7vw,42px);text-align:center;background:var(--code-bg);color:var(--code-hl);border-radius:14px;padding:18px;letter-spacing:.06em}
.mirror{display:inline-block;transform:scaleX(-1)}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.abc div{background:var(--surface-2);border:2px solid var(--line);border-radius:10px;text-align:center;padding:4px 0;line-height:1.2}
.abc b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--brand)}
.abc span{font-size:16px}
.abc-legend{font-size:15px;color:var(--muted)}

/* code */
.code{background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:14px 16px;font-family:var(--f-code);font-size:15px;line-height:1.75;overflow-x:auto}
.code .ln{direction:ltr;text-align:left;white-space:pre;unicode-bidi:plaintext}
.code .tag{color:#7FC8FF}.code .attr{color:#FFB86B}.code .str{color:#9BE58B}.code .cm{color:var(--code-dim)}
.code .ln.found{background:color-mix(in srgb,var(--code-hl) 25%,transparent);border-radius:6px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.split > *{min-width:0}
@media (max-width:620px){.split{grid-template-columns:1fr}}
.browser{background:var(--paper);color:var(--paper-ink);border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.browser .top{background:#E6EAF0;padding:6px 10px;display:flex;gap:5px;align-items:center}
.browser .top i{width:10px;height:10px;border-radius:50%;background:#C3C9D3}
.browser .body{padding:18px;min-height:120px;display:grid;place-items:center;text-align:center}
.browser .body h1{font-size:30px;overflow-wrap:anywhere}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.site{display:flex;flex-direction:column;gap:10px;align-items:center}
.site .shield{width:64px;height:64px}

/* blocks */
.blocks{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:14px}
.blk{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--blk-ink);font-family:var(--f-display);font-size:19px;padding:8px 14px;border-radius:10px;border:3px solid transparent;transition:transform .15s}
.blk.var{background:var(--blk-var)}.blk.ctrl{background:var(--blk-ctrl)}.blk.say{background:var(--blk-say)}
.blk.i1{margin-inline-start:34px}
.blk.cur{border-color:var(--ink);transform:translateX(-6px)}
.pill{background:rgba(255,255,255,.9);color:#222;border-radius:999px;padding:0 12px;font-size:17px}
.pill.box{border-radius:6px}
.trace{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.varbox{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-size:17px}
.varbox b{font-family:var(--f-display);font-weight:400;color:var(--blk-var);font-size:22px}
.bubble{background:var(--surface);border:2px solid var(--blk-say);border-radius:16px;padding:8px 16px;font-family:var(--f-display);font-size:22px;color:var(--blk-say)}

/* overlay + cert */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);padding:16px}
.modal{background:var(--surface);border:3px solid var(--sun);border-radius:24px;padding:28px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.modal .bigstar{font-size:84px;line-height:1;color:var(--sun);animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.cert{border:6px double var(--sun);background:var(--surface);border-radius:24px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.cert h1{font-size:clamp(30px,7vw,46px);color:var(--brand)}
.cert .who{font-family:var(--f-display);font-size:clamp(28px,6vw,40px)}
.cert .av{font-size:70px;line-height:1}
.oath{text-align:start;background:var(--surface-2);border-radius:14px;padding:14px 18px;max-width:520px}
.oath ul{margin:6px 0 0;padding-inline-start:22px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" dir="rtl" lang="he"></div>
<canvas id="fx" hidden></canvas>

<script>
document.documentElement.lang='he';document.documentElement.dir='rtl';
const app=document.getElementById('app');
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- helpers ---------- */
function h(tag,props,...kids){const el=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;
    else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(v===true)el.setAttribute(k,'');else if(v!==false&&v!=null)el.setAttribute(k,v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}
  return el;}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const FIN={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
const norm=s=>(s||'').replace(/[֑-ׇ]/g,'').replace(/[ךםןףץ]/g,c=>FIN[c]).replace(/[^א-ת0-9]/g,'');
const ABC='אבגדהוזחטיכלמנסעפצקרשת';
const enc=(s,f)=>[...s].map(c=>{const i=ABC.indexOf(FIN[c]||c);return i<0?c:ABC[f(i)];}).join('');
const shift1=s=>enc(s,i=>(i+1)%22), atbash=s=>enc(s,i=>21-i);

/* ---------- state ---------- */
const KEY='kids-cyber-v1';
let S={name:'',avatar:'',done:[false,false,false,false,false]};
try{const raw=localStorage.getItem(KEY);if(raw)S={...S,...JSON.parse(raw)};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const starCount=()=>S.done.filter(Boolean).length;

/* ---------- art ---------- */
const SHIELD=`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 8 13v17c0 15 10 26 24 30 14-4 24-15 24-30V13L32 4Z" fill="var(--brand)"/><path d="M32 10 14 17v13c0 11 7 20 18 24V10Z" fill="color-mix(in srgb,var(--brand) 75%,#fff)"/><rect x="23" y="29" width="18" height="15" rx="3" fill="var(--sun)"/><path d="M26 29v-4a6 6 0 0 1 12 0v4" stroke="var(--sun)" stroke-width="4" fill="none"/><circle cx="32" cy="36" r="2.4" fill="#2A1A00"/></svg>`;
const ROBOT=`<svg viewBox="0 0 160 170" aria-hidden="true"><line x1="80" y1="8" x2="80" y2="30" stroke="var(--muted)" stroke-width="5"/><circle cx="80" cy="8" r="7" fill="var(--sun)"/><rect x="28" y="30" width="104" height="80" rx="26" fill="var(--brand)"/><rect x="42" y="48" width="76" height="40" rx="18" fill="var(--surface)"/><circle cx="64" cy="68" r="8" fill="var(--ink)"/><circle cx="96" cy="68" r="8" fill="var(--ink)"/><circle cx="67" cy="65" r="2.5" fill="var(--surface)"/><circle cx="99" cy="65" r="2.5" fill="var(--surface)"/><path d="M70 82q10 7 20 0" stroke="var(--ink)" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="44" y="114" width="72" height="50" rx="16" fill="var(--brand)"/><path d="M80 120 64 126v10c0 9 7 15 16 18 9-3 16-9 16-18v-10Z" fill="var(--sun)"/><rect x="74" y="133" width="12" height="9" rx="2" fill="var(--brand)"/></svg>`;

/* ---------- shell ---------- */
function bar(){
  const stars=h('span',{class:'stars','aria-label':`${starCount()} כוכבים מתוך 5`},
    ...S.done.map(d=>h('span',{class:d?'':'off'},'★')));
  return h('header',{class:'bar'},h('div',{class:'bar-in'},
    h('button',{class:'logo link',style:'text-decoration:none;color:inherit',onclick:()=>S.name?show('map'):show('start'),html:SHIELD+'<span>מטה הסייבר</span>'}),
    h('span',{class:'spacer'}),
    S.name?h('span',{class:'chip'},h('span',{class:'av'},S.avatar),S.name):null,
    h('span',{class:'chip'},stars)));
}
function show(screen,arg){
  app.innerHTML='';app.append(bar());
  const w=h('main',{class:'wrap'});app.append(w);
  ({start:Start,map:MapScreen,mission:MissionScreen,cert:Cert})[screen](w,arg);
  window.scrollTo({top:0,behavior:'instant'});
}

/* ---------- start ---------- */

/* ---------- mission engine ---------- */
function MissionScreen(w,idx){
  const steps=STEPS[idx]();let cur=0;
  const head=h('div',{class:'mhead'});
  const body=h('section',{class:'card stack stepcard'});
  const nav=h('div',{class:'nav'});
  w.append(head,body,nav);
  function render(){
    const st=steps[cur];
    head.innerHTML='';
    head.append(h('span',{class:'eyebrow'},`משימה ${idx+1} מתוך 5 · שלב ${cur+1} מתוך ${steps.length}`),
      h('h2',{},MISSIONS[idx].t),
      h('div',{class:'dots','aria-hidden':'true'},...steps.map((_,i)=>h('i',{class:i===cur?'on':i<cur?'past':''}))));
    body.innerHTML='';
    const nextBtn=h('button',{class:'btn'+(cur===steps.length-1?' sun':''),disabled:!st.free},cur===steps.length-1?'סיימתי! קבלו כוכב ★':'הבא ←');
    const unlock=()=>{nextBtn.disabled=false;st.free=true;};
    body.append(...[].concat(st.view(unlock)));
    nextBtn.onclick=()=>{if(cur<steps.length-1){cur++;render();window.scrollTo({top:0,behavior:REDUCED?'instant':'smooth'});}else finish(idx);};
    nav.innerHTML='';
    nav.append(cur>0?h('button',{class:'btn ghost',onclick:()=>{cur--;render();}},'→ חזרה'):h('button',{class:'btn ghost',onclick:()=>show('map')},'→ למפה'),nextBtn);
  }
  render();
}
function finish(idx){
  const first=!S.done[idx];S.done[idx]=true;save();
  if(first)confetti();
  const last=starCount()===5;
  const ov=h('div',{class:'overlay',role:'dialog','aria-modal':'true'},
    h('div',{class:'modal'},
      h('div',{class:'bigstar'},'★'),
      h('h2',{style:'font-size:30px'},first?'קיבלתם כוכב!':'עשיתם את זה שוב!'),
      h('p',{class:'big'},`משימה ${idx+1}: ${MISSIONS[idx].t} — הושלמה.`),
      h('p',{class:'muted'},`יש לכם ${starCount()} כוכבים מתוך 5`),
      h('button',{class:'btn sun',onclick:()=>{ov.remove();show(last?'cert':'map');}},last?'לתעודה שלי':'חזרה למפת המשימות')));
  document.body.append(ov);ov.querySelector('button').focus();
}

/* reusable: options that must be answered right (retry allowed) */
function choice(opts,correct,onRight,{two=false,cls='',why={}}={}){
  const fb=h('p',{class:'fb',role:'status'});
  const box=h('div',{class:'opts'+(two?' two':'')});
  opts.forEach((o,i)=>{const b=h('button',{class:'opt '+cls,onclick:()=>{
    if(i===correct){b.classList.add('ok');[...box.children].forEach(x=>x.disabled=true);fb.className='fb ok';fb.textContent=why.ok||'נכון!';onRight&&onRight();}
    else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');b.disabled=true;fb.className='fb no';fb.textContent=(why.no&&why.no[i])||why.noAll||'לא בדיוק… נסו תשובה אחרת.';}
  }},o);box.append(b);});
  return [box,fb];
}
function answerBox(id,label,check,{hint,okMsg='מעולה! פיענחתם.',onRight}){
  const inp=h('input',{class:'input',id,autocomplete:'off',placeholder:'כתבו כאן'});
  const fb=h('p',{class:'fb',role:'status'});
  const hintP=h('p',{class:'clue',hidden:true},hint||'');
  const go=()=>{if(!inp.value.trim()){fb.className='fb no';fb.textContent='עוד לא כתבתם תשובה.';return;}
    if(check(inp.value)){fb.className='fb ok';fb.textContent=okMsg;inp.disabled=true;onRight&&onRight();}
    else{fb.className='fb no';fb.textContent='עוד לא… בדקו שוב אות אחרי אות.';}};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  return h('div',{class:'stack',style:'gap:10px'},
    h('label',{for:id,style:'font-family:var(--f-display);font-size:19px'},label),
    h('div',{class:'row'},inp,h('button',{class:'btn small',onclick:go},'בדיקה')),
    hint?h('div',{},h('button',{class:'link',onclick:e=>{hintP.hidden=false;e.target.remove();}},'צריכים רמז?'),hintP):null,
    fb);
}

/* ---------- confetti ---------- */
function confetti(){
  if(REDUCED)return;const c=document.getElementById('fx');c.hidden=false;
  const x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#F7A41D','#2462F0','#0E9B67','#DC3D43','#8456E8'];
  const ps=Array.from({length:120},()=>({x:W/2,y:H/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,s:6+Math.random()*6,c:cols[Math.random()*5|0],r:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++f<110)requestAnimationFrame(tick);else{x.clearRect(0,0,W,H);c.hidden=true;}})();
}

show(S.name?'map':'start');
